name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m pipeline.check_cases
      - run: uv run python -m pipeline.check_tests

  test-api:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: docker compose up -d --build
      - run: uv run python scripts/wait_for_app.py
      - run: uv run pytest tests/gold tests/api --junitxml=reports/junit.xml
      - run: uv run python -m pipeline.coverage_matrix
        if: always()
      - run: uv run python -m pipeline.push_results --backend file
        if: always()
      - run: uv run python -m pipeline.report
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - run: cat reports/traceability.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - run: docker compose logs --tail=100
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-results, path: reports/ }
  export:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Export 1
        run: uv run python -m pipeline.export --backend file
      - name: Empreintes après export 1
        run: sha256sum mapping.json reports/xray_mock/tests/*.json > /tmp/run1.txt
      - name: Export 2 (idempotence)
        run: uv run python -m pipeline.export --backend file
      - name: Vérifier absence de doublon et stabilité
        run: |
          expected=$(python3 -c "import json,glob;print(sum(len(json.load(open(f))['cases']) for f in glob.glob('cases/REQ-*.json')))")
          actual=$(ls reports/xray_mock/tests | wc -l)
          echo "attendu=$expected obtenu=$actual"
          test "$expected" -eq "$actual"
          sha256sum mapping.json reports/xray_mock/tests/*.json > /tmp/run2.txt
          diff /tmp/run1.txt /tmp/run2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: export-file
          path: |
            reports/xray_mock/
            mapping.json      
