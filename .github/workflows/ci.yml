name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
  test-api:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: docker compose up -d --build
      - run: uv run python scripts/wait_for_app.py
      - run: uv run python -m pipeline.check_cases
      - run: uv run python -m pipeline.check_tests
      - run: uv run pytest tests/gold tests/api --junitxml=reports/junit.xml
      - run: uv run python -m pipeline.coverage_matrix
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-results, path: reports/ }
