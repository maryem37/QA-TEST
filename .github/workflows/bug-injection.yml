name: bug-injection

on:
  workflow_dispatch:
    inputs:
      bug:
        description: "Identifiant du bug à injecter"
        required: true
        default: bug-001

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:8080
      COMPOSE_PARALLEL_LIMIT: "2"
      BUG: ${{ inputs.bug }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Injecter le bug
        run: |
          echo "### Bug injecté" >> "$GITHUB_STEP_SUMMARY"
          uv run python scripts/inject_bug.py "$BUG" | tee -a "$GITHUB_STEP_SUMMARY"

      - run: docker compose up -d --build
      - run: uv run python scripts/wait_for_app.py

      - name: Tests API (échec attendu)
        run: uv run pytest tests/gold tests/api -q -rfx --junitxml=reports/junit.xml

      - run: uv run python -m pipeline.push_results --backend file
        if: always()
      - run: uv run python -m pipeline.report
        if: always()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
        if: always()

      - name: Logs des conteneurs
        if: failure()
        run: docker compose logs --no-color --tail 50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bug-injection-results
          path: |
            reports/junit.xml
            reports/report.md
          if-no-files-found: warn

      - run: docker compose down -v
        if: always()
